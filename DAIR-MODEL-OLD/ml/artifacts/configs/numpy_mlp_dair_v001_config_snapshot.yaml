experiment_id: numpy_mlp_dair_v001
seed: 42

dataset:
  processed_dir: data/processed/dair_ai_emotion
  text_column: text
  label_column: label
  label_name_column: label_name
  example_id_column: example_id

vectorizer:
  lowercase: true
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.98
  max_features: 5000
  sublinear_tf: true

model:
  hidden_dim: 128
  num_classes: 6

training:
  batch_size: 64
  epochs: 15
  learning_rate: 0.05

artifacts:
  vectorizer: ml/artifacts/tokenizers/numpy_mlp_dair_v001_tfidf.joblib
  model: ml/artifacts/models/numpy_mlp_dair_v001.npz
  metrics: ml/artifacts/metrics/numpy_mlp_dair_v001_metrics.json
  epoch_log: ml/artifacts/logs/numpy_mlp_dair_v001_epochs.csv
  validation_predictions: ml/artifacts/predictions/numpy_mlp_dair_v001_validation_predictions.csv
  test_predictions: ml/artifacts/predictions/numpy_mlp_dair_v001_test_predictions.csv
  config_snapshot: ml/artifacts/configs/numpy_mlp_dair_v001_config_snapshot.yaml