[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmotionlab"
version = "0.1.0"
description = "Interactive NLP laboratory for emotion classification and model-behavior analysis"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]
addopts = "-ra"
